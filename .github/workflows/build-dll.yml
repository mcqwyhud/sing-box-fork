name: Build Windows 64-bit DLL

on:
  push:
    branches: [ "dev-1.13.4" ]
  workflow_dispatch:

jobs:
  build-windows-dll:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    # 💡 解决方案：放弃原来的 setup-mingw，改用 Windows 官方自带的 choco 默默安装 mingw 
    # 并且加入 --no-progress 减少日志，末尾 || exit 0 防止它由于非致命清理错误阻断流程
    - name: Install MinGW GCC (Fixed)
      run: |
        choco install mingw --no-progress -y
        echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $GITHUB_PATH
      shell: bash

    - name: Verify Environment
      run: |
        go version
        gcc --version

    - name: Build AMD64 DLL
      env:
        GOOS: windows
        GOARCH: amd64
        CGO_ENABLED: 1
      run: |
        mkdir -p build
        go build -buildmode=c-shared -ldflags="-s -w" -o build/sing-box.dll main_dll.go
      shell: bash

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sing-box-windows-x64-dll
        path: |
          build/sing-box.dll
          build/sing-box.h
