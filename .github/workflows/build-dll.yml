name: Build Windows 64-bit DLL

on:
  push:
    branches: [ "dev-1.13.4" ]
  workflow_dispatch:

jobs:
  build-windows-dll:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.7' # 完美匹配你项目的 Go 版本
        cache: true

    - name: Install MinGW GCC (Fixed)
      run: |
        choco install mingw --no-progress -y
        echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $GITHUB_PATH
      shell: bash

    - name: Verify Environment
      run: |
        go version
        gcc --version

    - name: Build AMD64 DLL
      env:
        GOOS: windows
        GOARCH: amd64
        CGO_ENABLED: 1
      run: |
        mkdir -p build
        # 切换到 cmd/sing-box 目录下，直接编译 main_dll.go，避免找不到本地依赖
        cd cmd/sing-box
        go build -buildmode=c-shared -ldflags="-s -w" -o ../../build/sing-box.dll main_dll.go
      shell: bash

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sing-box-windows-x64-dll
        path: |
          build/sing-box.dll
          build/sing-box.h
