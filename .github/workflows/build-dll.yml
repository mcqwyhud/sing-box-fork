name: Build Windows 64-bit DLL

on:
  push:
    branches: [ "dev-1.13.4" ] # 精准匹配你当前的分支
  workflow_dispatch: # 允许你在网页上点击按钮手动触发

jobs:
  build-windows-dll:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true # 开启缓存，加速后续编译

    - name: Install MinGW (GCC Compiler)
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64

    - name: Verify Environment
      run: |
        go version
        gcc --version

    - name: Build AMD64 DLL
      env:
        GOOS: windows
        GOARCH: amd64
        CGO_ENABLED: 1
      run: |
        # 确保创建输出目录
        mkdir build
        # 编译 c-shared 动态链接库
        go build -buildmode=c-shared -ldflags="-s -w" -o build/sing-box.dll main_dll.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sing-box-windows-x64-dll
        path: |
          build/sing-box.dll
          build/sing-box.h
